name: Generate phase-one migration scaffold

on:
  push:
    branches: ['maintenance/audit-01-07-2026-11-15']
    paths:
      - '.migration-scaffold/phase1.txt'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned Supabase CLI v2
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Generate migration filename with Supabase CLI
        run: supabase migration new phase1_commerce_integrity

      - name: Upload generated migration scaffold
        uses: actions/upload-artifact@v4
        with:
          name: phase1-migration-scaffold
          path: supabase/migrations/*_phase1_commerce_integrity.sql
          if-no-files-found: error
          retention-days: 1
