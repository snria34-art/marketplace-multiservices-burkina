name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test Flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify Flutter toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Ensure dependency files remain unchanged
        run: git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
