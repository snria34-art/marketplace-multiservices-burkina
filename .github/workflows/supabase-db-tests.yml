name: Supabase database tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: supabase-db-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations and local demo seed
        run: supabase db reset

      - name: Run database and RLS tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: if command -v supabase >/dev/null 2>&1; then supabase stop; else echo 'Supabase CLI was not installed; nothing to stop.'; fi
