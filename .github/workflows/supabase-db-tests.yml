name: Supabase database tests

# Every database command is explicitly local. This workflow must never link to,
# reset, or test a hosted Supabase project. Validate migrations before merging.
on:
  push:
    branches: ['maintenance/audit-01-07-2026-11-15']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/seed.test.sql'
      - '.github/workflows/supabase-db-tests.yml'
  pull_request:
    branches: ['maintenance/audit-01-07-2026-11-15']
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/seed.test.sql'
      - '.github/workflows/supabase-db-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-db-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  database-tests:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/maintenance/audit-01-07-2026-11-15'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.122.1

      - name: Verify pinned Supabase CLI
        run: supabase --version

      # A fresh GitHub-hosted runner has no linked project or local stack.
      # Both commands explicitly target local containers only.
      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Rebuild local database from every migration and test seed
        run: supabase db reset --local

      - name: Run pgTAP tests against the local database only
        run: supabase test db --local

      - name: Stop local Supabase stack
        if: always()
        shell: bash
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop
          else
            echo 'Supabase CLI was not installed; nothing to stop.'
          fi
