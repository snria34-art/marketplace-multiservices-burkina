name: Migrate database to the new Supabase project

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: "Type the exact new Supabase project ref to confirm the destination"
        required: true
        type: string
      confirm_apply:
        description: "Leave blank for preview only. To apply migrations after review, type APPLY-MIGRATIONS-piojnvhpqbyvaijzhatm"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: migrate-new-supabase-project
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply repository migrations to Supabase P
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: "acceptable-adaptation / production"
    steps:
      - name: Verify the exact destination
        env:
          CONFIRM_TARGET: ${{ inputs.confirm_target }}
          SUPABASE_PROJECT_REF: piojnvhpqbyvaijzhatm
        run: |
          if [ "$CONFIRM_TARGET" != "$SUPABASE_PROJECT_REF" ]; then
            echo "Confirmation did not match the fixed destination project."
            exit 1
          fi

      - name: Checkout the validated application branch
        uses: actions/checkout@v4
        with:
          ref: maintenance/audit-01-07-2026-11-15

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.122.1

      - name: Link only to the new Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_NEW_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: piojnvhpqbyvaijzhatm
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # Supavisor may briefly cache the old credential immediately after a
      # database password rotation. Allow that cache to refresh before the
      # first SQL connection attempt.
      - name: Allow Supabase pooler credentials to refresh
        run: sleep 20

      - name: Preview pending migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_NEW_DB_PASSWORD }}
        run: supabase db push --linked --dry-run

      - name: Apply migrations only after explicit confirmation
        if: ${{ inputs.confirm_apply == 'APPLY-MIGRATIONS-piojnvhpqbyvaijzhatm' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_NEW_DB_PASSWORD }}
        run: supabase db push --linked --yes

      - name: Keep the run preview-only unless explicitly confirmed
        if: ${{ inputs.confirm_apply != 'APPLY-MIGRATIONS-piojnvhpqbyvaijzhatm' }}
        run: echo "Preview completed. No database migrations were applied."

      - name: Verify migration history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_NEW_DB_PASSWORD }}
        run: supabase migration list --linked
