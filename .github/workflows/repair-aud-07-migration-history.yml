name: Repair AUD-07 migration history (history only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type exactly REPAIR-HISTORY-20261104020500 to mark only this already-applied migration"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aud-07-migration-history-repair
  cancel-in-progress: false

jobs:
  repair-history:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: dzhhsoikzxibmngjzcch
      MIGRATION_VERSION: "20261104020500"
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require exact manual confirmation
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "${CONFIRMATION}" != "REPAIR-HISTORY-20261104020500" ]]; then
            echo "Confirmation text did not match. No migration history change was made."
            exit 1
          fi
          if [[ ! -f "supabase/migrations/20261104020500_add_toy_weapon_product_classification.sql" ]]; then
            echo "Expected migration file is missing. Refusing to continue."
            exit 1
          fi
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" || -z "${SUPABASE_DB_PASSWORD}" ]]; then
            echo "Configure SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in GitHub Actions secrets."
            exit 1
          fi

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Link explicitly to the intended Supabase project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "${PROJECT_REF}" --password "${SUPABASE_DB_PASSWORD}"

      - name: Show migration history before repair
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list

      - name: Mark only the verified existing migration as applied
        shell: bash
        run: |
          set -euo pipefail
          # This command changes only supabase_migrations.schema_migrations.
          # It does not execute the migration SQL or modify the existing cron job.
          supabase migration repair "${MIGRATION_VERSION}" --status applied

      - name: Verify migration history after repair
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list
