name: Native debug validation

# Debug validation only. No release signing, store upload or deployment.
on:
  push:
    branches: ['maintenance/audit-01-07-2026-11-15', 'integration/firebase-mobile-client']
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/prepare-android-gradle.sh'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-debug-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug:
    name: Build Android debug APK (unsigned)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure repositories for Flutter included Gradle build
        run: bash scripts/prepare-android-gradle.sh

      - name: Build Android debug APK
        run: flutter build apk --debug

  ios-simulator-debug:
    name: Build iOS simulator debug app (unsigned)
    # macOS runners consume a larger Actions budget; keep iOS manual-only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS simulator debug app
        run: flutter build ios --simulator --debug
