name: Native platform build

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

# Keep this workflow manual until signing and Firebase configuration are ready.
# This prevents a version tag from unexpectedly consuming Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Dependencies
        run: flutter pub get
      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

  ios-release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Build iOS simulator (debug, unsigned)
        run: flutter build ios --simulator --debug
