name: Native debug validation

# Debug validation only. No release signing, store upload or deployment.
on:
  push:
    branches: ['maintenance/audit-01-07-2026-11-15', 'integration/firebase-mobile-client']
    paths:
      - 'android/**'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/prepare-android-gradle.sh'
      - '.github/workflows/native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-debug-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-debug:
    name: Validate and build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart and Flutter code
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        run: flutter test --no-pub

      - name: Configure repositories for Flutter included Gradle build
        run: bash scripts/prepare-android-gradle.sh

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Preserve Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-burkina-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Install and launch APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -eu
            apk="build/app/outputs/flutter-apk/app-debug.apk"
            package="com.marketplaceburkina.marketplace_multiservices_burkina"

            # Do not install until the emulator is online and Android has finished booting.
            boot_ready=0
            for attempt in $(seq 1 120); do
              device_state="$(adb -s emulator-5554 get-state 2>/dev/null || true)"
              if [ "$device_state" = "device" ]; then
                boot_completed="$(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
                if [ "$boot_completed" = "1" ]; then
                  boot_ready=1
                  break
                fi
              elif [ "$((attempt % 12))" -eq 0 ]; then
                adb reconnect offline || true
              fi
              sleep 5
            done
            if [ "$boot_ready" -ne 1 ]; then
              echo "Android smoke test: emulator did not become fully booted and online." >&2
              adb devices -l >&2 || true
              exit 1
            fi

            # Package Manager can briefly lose its Binder connection on slow software emulation.
            installed=0
            for attempt in 1 2 3; do
              if adb -s emulator-5554 install -r --no-streaming "$apk"; then
                installed=1
                break
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "APK installation attempt $attempt failed; reconnecting ADB and retrying." >&2
                adb kill-server || true
                adb start-server
                adb -s emulator-5554 wait-for-device
                sleep 10
              fi
            done
            if [ "$installed" -ne 1 ]; then
              echo "Android smoke test: APK installation failed after 3 attempts." >&2
              adb devices -l >&2 || true
              exit 1
            fi

            adb -s emulator-5554 shell am force-stop "$package"
            adb -s emulator-5554 shell monkey -p "$package" 1
            app_pid="$(adb -s emulator-5554 shell pidof "$package" | tr -d '\r')"
            test -n "$app_pid" || { echo "Android smoke test: app process did not start." >&2; exit 1; }
            sleep 25
            adb -s emulator-5554 logcat --pid="$app_pid" -d -t 5000 > /tmp/marketplace-android-logcat.txt
            grep -E 'FATAL EXCEPTION|Fatal signal|Process: com\.marketplaceburkina\.marketplace_multiservices_burkina.*has died' /tmp/marketplace-android-logcat.txt > /tmp/marketplace-crash-matches.txt || test "$?" -eq 1
            if test -s /tmp/marketplace-crash-matches.txt; then
              echo "Android smoke test detected a crash in the Marketplace app process (PID $app_pid):" >&2
              cat /tmp/marketplace-crash-matches.txt >&2
              exit 1
            fi
            adb -s emulator-5554 shell pidof "$package" >/dev/null || { echo "Android smoke test: Marketplace app process exited during startup." >&2; exit 1; }

  ios-simulator-debug:
    name: Build iOS simulator debug app (unsigned)
    # macOS runners consume a larger Actions budget; keep iOS manual-only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Verify toolchain
        run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build iOS simulator debug app
        run: flutter build ios --simulator --debug
